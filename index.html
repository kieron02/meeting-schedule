<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meeting Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f0f4f8;--surface:#fff;--surface2:#e8edf5;--border:#d1d9e6;--text:#1a2035;--muted:#7a8aaa;--accent:#4f6ef7;--green:#16a34a;--red:#e11d48;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
/* HEADER */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;}
.topbar h1 .logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;}
.new-btn{display:flex;align-items:center;gap:7px;padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:opacity .15s;}
.new-btn:hover{opacity:.88;}
.new-btn svg{width:14px;height:14px;}
/* MAIN */
main{max-width:960px;margin:0 auto;padding:36px 24px;}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;font-family:'DM Mono',monospace;}
/* CARDS GRID */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:40px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative;text-decoration:none;color:inherit;display:block;}
.card:hover{box-shadow:0 6px 24px rgba(0,0,0,.1);transform:translateY(-2px);}
.card-accent{height:4px;border-radius:4px;margin-bottom:14px;}
.card-title{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.3;}
.card-dates{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:10px;}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;font-family:'DM Mono',monospace;}
.tag-meetings{background:#eff6ff;color:#1d4ed8;}
.tag-days{background:#f0fdf4;color:#15803d;}
.card-del{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:6px;background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:background .15s,color .15s;}
.card:hover .card-del{display:flex;}
.card-del:hover{background:#ffe4e6;color:var(--red);}
/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .icon{font-size:48px;margin-bottom:16px;opacity:.4;}
.empty p{font-size:14px;line-height:1.6;}
/* SYNC */
#sync-badge{font-size:11px;font-family:'DM Mono',monospace;padding:4px 10px;border-radius:20px;background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;}
#sync-badge.err{background:#fef2f2;border-color:#fecaca;color:#dc2626;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;width:380px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 48px rgba(0,0,0,.15);transform:translateY(10px);transition:transform .2s;}
.overlay.open .modal{transform:translateY(0);}
.modal h2{font-size:16px;font-weight:700;}
.modal p{font-size:13px;color:var(--muted);line-height:1.5;margin-top:-8px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace;}
.field input{background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--accent);background:#fff;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.color-row{display:flex;gap:8px;flex-wrap:wrap;}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s;}
.color-opt.selected{border-color:var(--text);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}

/* DEL CONFIRM */
.del-modal{width:300px;}
.del-modal p{font-size:13px;color:var(--muted);line-height:1.5;}
.btn-danger{background:#ffe4e6;color:var(--red);border:1px solid #fecdd3;}
</style>
</head>
<body>

<div class="topbar">
  <h1><div class="logo">📅</div> Meeting Manager</h1>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="sync-badge">● Live</span>
    <button class="new-btn" id="newMeetingBtn">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
      New Meeting Schedule
    </button>
  </div>
</div>

<main>
  <div class="section-title">Your Schedules</div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" style="display:none;">
    <div class="icon">📋</div>
    <p>No meeting schedules yet.<br/>Click <strong>New Meeting Schedule</strong> to create one.</p>
  </div>
</main>

<!-- CREATE MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>New Meeting Schedule</h2>
    <p>Give it a name and pick your date range.</p>
    <div class="field"><label>Schedule Name</label><input type="text" id="mname" placeholder="e.g. Steel Week Singapore 2025"/></div>
    <div class="row2">
      <div class="field"><label>Start Date</label><input type="date" id="mstart"/></div>
      <div class="field"><label>End Date</label><input type="date" id="mend"/></div>
    </div>
    <div class="field">
      <label>Colour</label>
      <div class="color-row" id="colorRow"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="createBtn">Create Schedule</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="overlay" id="delOverlay">
  <div class="modal del-modal">
    <h2>Delete schedule?</h2>
    <p id="delMsg"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="delCancel">Cancel</button>
      <button class="btn btn-danger" id="delConfirm">Delete</button>
    </div>
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey:            "AIzaSyB0Q7WDraFKaKjxqbeZ3GIYAx-T5pFz02c",
  authDomain:        "meeting-schedule-9b4cb.firebaseapp.com",
  databaseURL:       "https://meeting-schedule-9b4cb-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "meeting-schedule-9b4cb",
  storageBucket:     "meeting-schedule-9b4cb.firebasestorage.app",
  messagingSenderId: "861137429545",
  appId:             "1:861137429545:web:a42ffa24bb7996b08ea838"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var schedulesRef = db.ref('schedules');

var COLORS = ['#4f6ef7','#ea580c','#15803d','#e11d48','#7c3aed','#0284c7','#d97706','#0f766e'];
var selectedColor = COLORS[0];
var schedules = {};
var delId = null;

// ── COLOR PICKER ─────────────────────────────────────────────────
var colorRow = document.getElementById('colorRow');
COLORS.forEach(function(c) {
  var dot = document.createElement('div');
  dot.className = 'color-opt' + (c === selectedColor ? ' selected' : '');
  dot.style.background = c;
  dot.addEventListener('click', function() {
    selectedColor = c;
    document.querySelectorAll('.color-opt').forEach(function(d){ d.classList.remove('selected'); });
    dot.classList.add('selected');
  });
  colorRow.appendChild(dot);
});

// ── FIREBASE LISTENER ────────────────────────────────────────────
schedulesRef.on('value', function(snap) {
  schedules = snap.val() || {};
  renderCards();
  document.getElementById('sync-badge').textContent = '● Live';
  document.getElementById('sync-badge').className = '';
  document.getElementById('sync-badge').id = 'sync-badge';
}, function() {
  document.getElementById('sync-badge').className = 'err';
  document.getElementById('sync-badge').textContent = '✕ Offline';
});

// ── RENDER CARDS ─────────────────────────────────────────────────
function renderCards() {
  var container = document.getElementById('cards');
  container.innerHTML = '';
  var keys = Object.keys(schedules);
  document.getElementById('empty').style.display = keys.length ? 'none' : 'block';

  keys.sort(function(a,b){ return (schedules[b].createdAt||0)-(schedules[a].createdAt||0); });

  keys.forEach(function(id) {
    var s = schedules[id];
    var card = document.createElement('a');
    card.className = 'card';
    card.href = 'meeting.html?id=' + id;

    var accent = document.createElement('div');
    accent.className = 'card-accent';
    accent.style.background = s.color || '#4f6ef7';

    var title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = s.name;

    var dates = document.createElement('div');
    dates.className = 'card-dates';
    dates.textContent = fmtDate(s.startDate) + ' → ' + fmtDate(s.endDate);

    var meta = document.createElement('div');
    meta.className = 'card-meta';

    var mCount = s.meetings ? Object.keys(s.meetings).length : 0;
    var dCount = s.days     ? Object.keys(s.days).length     : 0;

    var t1 = document.createElement('span'); t1.className='tag tag-days';     t1.textContent = dCount + ' days';
    var t2 = document.createElement('span'); t2.className='tag tag-meetings'; t2.textContent = mCount + ' meetings';
    meta.appendChild(t1); meta.appendChild(t2);

    var delBtn = document.createElement('button');
    delBtn.className = 'card-del'; delBtn.textContent = '✕'; delBtn.title = 'Delete';
    delBtn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); openDel(id, s.name); });

    card.appendChild(accent); card.appendChild(title); card.appendChild(dates); card.appendChild(meta); card.appendChild(delBtn);
    container.appendChild(card);
  });
}

function fmtDate(str) {
  if (!str) return '—';
  var d = new Date(str + 'T00:00:00');
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getFullYear();
}

// ── CREATE MODAL ─────────────────────────────────────────────────
var overlay = document.getElementById('overlay');
document.getElementById('newMeetingBtn').addEventListener('click', function() {
  document.getElementById('mname').value = '';
  document.getElementById('mstart').value = '';
  document.getElementById('mend').value = '';
  overlay.classList.add('open');
  setTimeout(function(){ document.getElementById('mname').focus(); }, 50);
});
document.getElementById('cancelBtn').addEventListener('click', function(){ overlay.classList.remove('open'); });
overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.classList.remove('open'); });

document.getElementById('createBtn').addEventListener('click', function() {
  var name  = document.getElementById('mname').value.trim();
  var start = document.getElementById('mstart').value;
  var end   = document.getElementById('mend').value;
  if (!name)  { document.getElementById('mname').focus(); return; }
  if (!start) { document.getElementById('mstart').focus(); return; }
  if (!end)   { document.getElementById('mend').focus(); return; }
  if (end < start) { alert('End date must be after start date.'); return; }

  // Build days array from date range
  var days = {}, meetings = {};
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOWL= ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var cur = new Date(start + 'T00:00:00');
  var endD= new Date(end   + 'T00:00:00');
  var idx = 0;
  while (cur <= endD) {
    var di  = cur.getDay();
    var key = DOW[di] + (idx > 0 ? idx : '');
    // ensure unique key
    while (days[key]) key = DOW[di] + (++idx);
    var dateLabel = cur.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][cur.getMonth()];
    days[key] = { key:key, label:DOWL[di], date:dateLabel };
    cur.setDate(cur.getDate() + 1);
    idx++;
  }

  var id = 'sched_' + Date.now();
  var newSchedule = {
    id: id,
    name: name,
    startDate: start,
    endDate: end,
    color: selectedColor,
    createdAt: Date.now(),
    days: days,
    meetings: meetings
  };

  db.ref('schedules/' + id).set(newSchedule, function(err) {
    if (!err) {
      overlay.classList.remove('open');
      window.location.href = 'meeting.html?id=' + id;
    } else {
      alert('Error creating schedule. Check your Firebase connection.');
    }
  });
});

document.getElementById('mname').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('createBtn').click(); });

// ── DELETE ───────────────────────────────────────────────────────
var delOverlay = document.getElementById('delOverlay');
function openDel(id, name) {
  delId = id;
  document.getElementById('delMsg').textContent = '"' + name + '" and all its meetings will be permanently deleted.';
  delOverlay.classList.add('open');
}
document.getElementById('delCancel').addEventListener('click', function(){ delOverlay.classList.remove('open'); delId=null; });
delOverlay.addEventListener('click', function(e){ if(e.target===delOverlay){ delOverlay.classList.remove('open'); delId=null; } });
document.getElementById('delConfirm').addEventListener('click', function(){
  if (!delId) return;
  db.ref('schedules/' + delId).remove();
  delOverlay.classList.remove('open'); delId = null;
});
</script>
</body>
</html>
